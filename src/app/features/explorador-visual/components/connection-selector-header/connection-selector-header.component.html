<header class="explorer-header">
  <div class="brand-block">
    <h1>Explorador Visual</h1>
    <p>Explore bancos, schemas, tabelas e dados sob demanda.</p>
  </div>

  <div class="explorer-actions">
    <p-select
      [ngModel]="conexao"
      (ngModelChange)="conexaoChange.emit($event)"
      [options]="conexoes"
      optionLabel="label"
      optionValue="value"
      placeholder="Conexao"
      aria-label="Conexao"
      [loading]="loadingConexoes"
      [filter]="true"
      filterPlaceholder="Buscar conexao..."
      styleClass="selector"
    />

    <p-select
      [ngModel]="ambiente"
      (ngModelChange)="ambienteChange.emit($event)"
      [options]="ambientes"
      optionLabel="label"
      optionValue="value"
      aria-label="Ambiente"
      styleClass="selector compact-selector"
    />

    <p-select
      [ngModel]="modoOperacao"
      (ngModelChange)="modoOperacaoChange.emit($event)"
      [options]="modosOperacao"
      optionLabel="label"
      optionValue="value"
      aria-label="Modo"
      styleClass="selector compact-selector"
    />

    <p-button
      icon="pi pi-refresh"
      severity="secondary"
      [text]="true"
      (click)="refresh.emit()"
      [disabled]="!conexao"
    />
  </div>
</header>
