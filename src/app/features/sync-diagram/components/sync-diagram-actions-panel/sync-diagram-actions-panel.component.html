<nav class="actions-palette" aria-label="Ações de sincronização">
  <button
    type="button"
    class="rail-btn rail-btn-mode-estrutura"
    [class.is-active]="isEstrutura()"
    pTooltip="Estrutura · DDL, colunas e FKs"
    tooltipPosition="right"
    [tooltipStyleClass]="tip.styleClass"
    [showDelay]="tip.showDelay"
    [hideDelay]="tip.hideDelay"
    aria-label="Modo estrutura"
    (click)="selectMode('estrutura')"
  >
    <i class="pi pi-sitemap" aria-hidden="true"></i>
  </button>

  <button
    type="button"
    class="rail-btn rail-btn-mode-dados"
    [class.is-active]="isDados()"
    pTooltip="Dados · linhas e registros"
    tooltipPosition="right"
    [tooltipStyleClass]="tip.styleClass"
    [showDelay]="tip.showDelay"
    [hideDelay]="tip.hideDelay"
    aria-label="Modo dados"
    (click)="selectMode('dados')"
  >
    <i class="pi pi-database" aria-hidden="true"></i>
  </button>

  <span class="rail-divider" aria-hidden="true"></span>

  <button
    type="button"
    class="rail-btn rail-btn-sync"
    pTooltip="Verificar diferenças e sincronizar"
    tooltipPosition="right"
    [tooltipStyleClass]="tip.styleClass"
    [showDelay]="tip.showDelay"
    [hideDelay]="tip.hideDelay"
    [attr.aria-label]="'Verificar e sincronizar · ' + scopeLabel"
    [disabled]="!hasSelection || running || syncDisabled"
    (click)="sincronizarSelecao.emit()"
  >
    <i class="pi pi-sync" aria-hidden="true"></i>
  </button>

  <span class="rail-divider" aria-hidden="true"></span>

  <button
    type="button"
    class="rail-btn"
    pTooltip="Recolher um nível"
    tooltipPosition="right"
    [tooltipStyleClass]="tip.styleClass"
    [showDelay]="tip.showDelay"
    [hideDelay]="tip.hideDelay"
    aria-label="Recolher nível"
    [disabled]="!canRecolher"
    (click)="recolher.emit()"
  >
    <i class="pi pi-replay" aria-hidden="true"></i>
  </button>

  <button
    type="button"
    class="rail-btn"
    pTooltip="Organizar layout"
    tooltipPosition="right"
    [tooltipStyleClass]="tip.styleClass"
    [showDelay]="tip.showDelay"
    [hideDelay]="tip.hideDelay"
    aria-label="Organizar automaticamente"
    (click)="autoLayout.emit()"
  >
    <i class="pi pi-th-large" aria-hidden="true"></i>
  </button>
</nav>
