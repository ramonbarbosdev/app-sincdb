<div class="sync-diagram-canvas">
  <div class="canvas-workspace">
    <div class="canvas-loading" *ngIf="state.loadingInitial()">
      <span class="loading-spinner" aria-hidden="true"></span>
      <!-- <span>Carregando bases...</span> -->
    </div>

    <f-flow
      *ngIf="!state.loadingInitial()"
      fDraggable
      class="diagram-flow"
      (fFullRendered)="onFlowReady()"
      (pointerdown)="onUserCanvasInteraction()"
    >
      <f-background>
        <f-circle-pattern [color]="canvasDotColor()" [radius]="canvasDotGap" />
      </f-background>

      <f-canvas
        fZoom
        [fWheelTrigger]="blockFlowWheelZoom"
        [fZoomMinimum]="0.4"
        [fZoomMaximum]="1.2"
        [fZoomStep]="0.1"
        (fCanvasChange)="onCanvasChange()"
      >
        <f-connection
          *ngFor="let edge of state.flowConnections()"
          [fConnectionId]="edge.id"
          [fSourceId]="edge.sourceId"
          [fTargetId]="edge.targetId"
          [fType]="connectionType"
          [fSelectionDisabled]="true"
          [fReassignDisabled]="true"
          [class.connection-active]="edge.active"
          [class.connection-erd-fk]="edge.kind === 'erd-fk'"
          [class.connection-operation]="edge.kind === 'operation-link'"
        />

        <div
          *ngFor="let lbl of state.flowConnectionLabels()"
          fNode
          [fNodeId]="lbl.id"
          [fNodePosition]="lbl.position"
          fNodeSelectionDisabled
          fNodeDraggingDisabled
          class="flow-edge-label"
        >
          <span class="edge-label-pill">{{ lbl.text }}</span>
        </div>

        <div
          *ngFor="let flowNode of state.flowNodes()"
          fNode
          [fNodeId]="flowNode.id"
          [fNodePosition]="flowNode.position"
          (fNodePositionChange)="onPositionChange(flowNode.id, $event)"
          [fNodeSelectionDisabled]="true"
          [fNodeDraggingDisabled]="false"
          class="flow-node-shell"
          [class.flow-node-erd]="flowNode.type === 'erd-table'"
        >
          <div
            fConnector
            [fConnectorId]="flowNode.sourceConnectorId"
            fConnectorType="source"
            fConnectorConnectableSide="right"
            class="flow-connector flow-connector-out"
          ></div>
          <div
            fConnector
            [fConnectorId]="flowNode.targetConnectorId"
            fConnectorType="target"
            fConnectorConnectableSide="left"
            class="flow-connector flow-connector-in"
          ></div>

          <app-sync-diagram-node-card
            *ngIf="flowNode.type === 'selector' && flowNode.selectorMeta"
            [node]="flowNode.selectorMeta"
            [items]="filteredItems(flowNode.id)"
            (filterChange)="onFilterChange(flowNode.id, $event)"
            (itemClick)="onItemClick(flowNode.selectorMeta, $event)"
            (action)="onNodeAction($event, flowNode.selectorMeta)"
          />

          <app-sync-operation-node-card
            *ngIf="flowNode.type === 'operation' && flowNode.operationMeta"
            [operationId]="flowNode.operationMeta.id"
            (toggleDetail)="onToggleOperationDetail(flowNode.operationMeta.id)"
            (close)="onDismissOperation(flowNode.operationMeta.id)"
            (cancel)="onCancelOperation(flowNode.operationMeta.id)"
            (retry)="onRetryOperation(flowNode.operationMeta.id)"
            (toggleErrors)="onToggleOperationErrors(flowNode.operationMeta.id)"
          />

          <app-sync-erd-table-node
            *ngIf="flowNode.type === 'erd-table'"
            [tableId]="flowNode.id"
          />
        </div>
      </f-canvas>

      <div class="minimap-shell" aria-label="Minimapa do diagrama">
        <span class="minimap-label">Mapa</span>
        <f-minimap class="minimap-widget" />
      </div>
    </f-flow>
  </div>

  <nav
    class="canvas-breadcrumb"
    *ngIf="!state.loadingInitial() && state.breadcrumbTrail().length"
    aria-label="Contexto da navegação"
  >
    <ng-container *ngFor="let crumb of state.breadcrumbTrail(); let last = last">
      <button
        type="button"
        class="crumb-btn"
        [class.is-current]="last"
        [attr.aria-current]="last ? 'location' : null"
        (click)="navigateBreadcrumb(crumb)"
      >
        {{ crumb.label }}
      </button>
      <span class="crumb-sep" *ngIf="!last" aria-hidden="true">›</span>
    </ng-container>
  </nav>

  <nav
    class="canvas-toolbar"
    *ngIf="!state.loadingInitial()"
    aria-label="Controles do diagrama"
  >
    <button
      type="button"
      class="tb-btn"
      pTooltip="Diminuir zoom"
      tooltipPosition="bottom"
      [tooltipStyleClass]="tip.styleClass"
      [showDelay]="tip.showDelay"
      [hideDelay]="tip.hideDelay"
      aria-label="Diminuir zoom"
      (click)="zoomOut()"
    >
      <i class="pi pi-search-minus" aria-hidden="true"></i>
    </button>
    <span class="tb-zoom">{{ zoomLevel() }}%</span>
    <button
      type="button"
      class="tb-btn"
      pTooltip="Aumentar zoom"
      tooltipPosition="bottom"
      [tooltipStyleClass]="tip.styleClass"
      [showDelay]="tip.showDelay"
      [hideDelay]="tip.hideDelay"
      aria-label="Aumentar zoom"
      (click)="zoomIn()"
    >
      <i class="pi pi-search-plus" aria-hidden="true"></i>
    </button>
    <span class="tb-sep" aria-hidden="true"></span>
    <button
      type="button"
      class="tb-btn"
      pTooltip="Ajustar tudo à tela"
      tooltipPosition="bottom"
      [tooltipStyleClass]="tip.styleClass"
      [showDelay]="tip.showDelay"
      [hideDelay]="tip.hideDelay"
      aria-label="Ajustar tudo à tela"
      (click)="fitView()"
    >
      <i class="pi pi-expand" aria-hidden="true"></i>
    </button>
    <button
      type="button"
      class="tb-btn tb-zoom-reset"
      pTooltip="Zoom 100%"
      tooltipPosition="bottom"
      [tooltipStyleClass]="tip.styleClass"
      [showDelay]="tip.showDelay"
      [hideDelay]="tip.hideDelay"
      aria-label="Zoom 100%"
      (click)="resetView()"
    >
      <span class="tb-zoom-label" aria-hidden="true">100%</span>
    </button>
    <span class="tb-sep" aria-hidden="true"></span>
    <button
      type="button"
      class="tb-btn tb-theme"
      [pTooltip]="themeService.isDark() ? 'Tema claro' : 'Tema escuro'"
      tooltipPosition="bottom"
      [tooltipStyleClass]="tip.styleClass"
      [showDelay]="tip.showDelay"
      [hideDelay]="tip.hideDelay"
      [attr.aria-label]="themeService.isDark() ? 'Alternar para tema claro' : 'Alternar para tema escuro'"
      (click)="themeService.toggle()"
    >
      <i
        class="pi"
        [class.pi-sun]="themeService.isDark()"
        [class.pi-moon]="!themeService.isDark()"
        aria-hidden="true"
      ></i>
    </button>
    <ng-container *ngIf="running">
      <span class="tb-sep" aria-hidden="true"></span>
      <button
        type="button"
        class="tb-btn tb-cancel"
        pTooltip="Cancelar operação"
        tooltipPosition="bottom"
        [tooltipStyleClass]="tip.styleClass"
        [showDelay]="tip.showDelay"
        [hideDelay]="tip.hideDelay"
        aria-label="Cancelar operação"
        (click)="cancelar.emit()"
      >
        <i class="pi pi-times-circle" aria-hidden="true"></i>
      </button>
    </ng-container>
  </nav>

  <div class="canvas-actions-float" *ngIf="!state.loadingInitial()">
    <ng-content />
  </div>

  <div
    class="sync-bottom-stack"
    *ngIf="!state.loadingInitial() && (showSyncFab || queue.items().length > 0)"
  >
    <div class="sync-bottom-actions" *ngIf="showSyncFab">
      <button
        type="button"
        class="sync-selection-btn"
        [class.mode-estrutura]="syncMode === 'estrutura'"
        [class.mode-dados]="syncMode === 'dados'"
        [disabled]="running || syncDisabled"
        [attr.aria-label]="'Sincronizar seleção · ' + scopeLabel"
        (click)="sincronizarSelecao.emit()"
      >
        <span class="sync-selection-icon" aria-hidden="true">
          <i class="pi pi-sync"></i>
        </span>
        <span class="sync-selection-text">
          <strong>Sincronizar seleção</strong>
          <span class="sync-selection-scope">{{ scopeLabel }}</span>
        </span>
        <span class="sync-selection-mode">{{ syncMode }}</span>
      </button>

      <button
        type="button"
        class="sync-queue-add-btn"
        [class.mode-estrutura]="syncMode === 'estrutura'"
        [class.mode-dados]="syncMode === 'dados'"
        [disabled]="enqueueDisabled"
        aria-label="Adicionar seleção à fila"
        (click)="adicionarFila.emit()"
      >
        <i class="pi pi-plus" aria-hidden="true"></i>
        <span>Fila</span>
      </button>
    </div>

    <app-sync-diagram-queue-list
      [running]="running"
      [canRunQueue]="canRunQueue"
      (removeItem)="removeFromQueue.emit($event)"
      (clearQueue)="clearQueue.emit()"
      (runQueue)="runQueue.emit()"
    />
  </div>
</div>
