<ng-container *ngIf="operation() as operation">
  <div
    class="operation-node-wrap"
    [class.mode-estrutura]="operation.mode === 'estrutura'"
    [class.mode-dados]="operation.mode === 'dados'"
    [class.phase-running]="isRunning()"
    [class.phase-verificado]="operation.phase === 'verificado'"
    [class.phase-erro]="operation.phase === 'erro'"
    [class.phase-concluido]="operation.phase === 'concluido'"
    [class.phase-cancelado]="operation.phase === 'cancelado'"
    [class.detail-open]="operation.detailOpen"
  >
    <button
      type="button"
      class="operation-node"
      [class.is-running]="isRunning()"
      (click)="onCardClick()"
    >
      <header class="operation-header" fDragHandle>
        <span class="operation-icon">⚙</span>
        <div class="operation-titles">
          <strong>{{ operation.label }}</strong>
          <span
            class="operation-phase-badge"
            [class.badge-running]="isRunning()"
            [class.badge-verificado]="operation.phase === 'verificado'"
            [class.badge-concluido]="operation.phase === 'concluido'"
            [class.badge-erro]="operation.phase === 'erro'"
            [class.badge-cancelado]="operation.phase === 'cancelado'"
          >{{ phaseLabel(operation.phase) }}</span>
        </div>
        <span class="operation-mode-badge">{{ operation.mode }}</span>
        <button
          *ngIf="!isRunning()"
          type="button"
          class="operation-close-btn"
          title="Fechar caixa de operação"
          aria-label="Fechar caixa de operação"
          (click)="onClose($event)"
        >
          ×
        </button>
      </header>

      <div class="operation-body">
        <div class="operation-progress-row" *ngIf="showProgress()">
          <div class="operation-progress-bar">
            <span class="operation-progress-fill" [style.width.%]="progressWidth()"></span>
          </div>
          <span class="operation-progress-label">{{ progressLabel() }}</span>
        </div>

        <p class="operation-table-hint" *ngIf="operation.tabelaAtual && isRunning()">
          Tabela: <span>{{ operation.tabelaAtual }}</span>
        </p>

        <div class="operation-error-panel" *ngIf="operation.phase === 'erro'">
          <p class="operation-error-summary">{{ primaryError() }}</p>
          <div class="operation-error-actions">
            <button type="button" class="op-action-btn op-action-retry" (click)="onRetry($event)">
              Repetir
            </button>
            <button
              type="button"
              class="op-action-btn op-action-details"
              *ngIf="showErrorDetailsButton()"
              (click)="onToggleErrors($event)"
            >
              {{ operation.errorsExpanded ? 'Ocultar detalhes' : 'Ver detalhes' }}
            </button>
          </div>
          <ul class="operation-error-list" *ngIf="operation.errorsExpanded && operation.errors?.length">
            <li *ngFor="let err of operation.errors">{{ err }}</li>
          </ul>
        </div>

        <p class="operation-message" *ngIf="operation.phase === 'cancelado'">
          Você cancelou esta operação. Nada foi marcado como falha.
        </p>
      </div>
    </button>

    <div class="operation-fab-strip" *ngIf="isRunning()">
      <button
        type="button"
        class="fab-btn fab-cancel"
        title="Cancelar operação"
        (click)="onCancel($event)"
      >⊗</button>
    </div>
  </div>
</ng-container>
