<div
  class="sync-diagram-page"
  [class.sync-diagram-canvas-theme-dark]="theme.isDark()"
  [class.sync-diagram-canvas-theme-light]="theme.isLight()"
>
  <div class="sync-diagram-main">
    <app-sync-diagram-canvas
      [running]="hasRunningOperation()"
      [syncDisabled]="isSyncDisabled()"
      [enqueueDisabled]="isEnqueueDisabled()"
      [canRunQueue]="canRunQueue()"
      [showSyncFab]="hasSyncableSelection()"
      [scopeLabel]="scopeLabel()"
      [syncMode]="state.syncMode()"
      (cancelar)="cancelarOperacao()"
      (sincronizarSelecao)="sincronizarSelecao()"
      (adicionarFila)="adicionarFila()"
      (runQueue)="executarFila()"
      (removeFromQueue)="removerDaFila($event)"
      (clearQueue)="limparFila()"
    >
      <app-sync-diagram-actions-panel
        [mode]="state.syncMode()"
        [scopeLabel]="scopeLabel()"
        [hasSelection]="hasSyncableSelection()"
        [running]="hasRunningOperation()"
        [syncDisabled]="isSyncDisabled()"
        [enqueueDisabled]="isEnqueueDisabled()"
        [canRecolher]="canRecolher()"
        [treeLayout]="state.treeLayout()"
        (modeChange)="setMode($event)"
        (sincronizarSelecao)="sincronizarSelecao()"
        (adicionarFila)="adicionarFila()"
        (recolher)="recolherNivel()"
        (autoLayout)="organizarCanvas()"
        (treeLayoutChange)="setTreeLayout($event)"
      />
    </app-sync-diagram-canvas>
  </div>
</div>
