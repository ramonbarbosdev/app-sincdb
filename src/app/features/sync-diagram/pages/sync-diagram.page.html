<div
  class="sync-diagram-page"
  [class.sync-diagram-canvas-theme-dark]="theme.isDark()"
  [class.sync-diagram-canvas-theme-light]="theme.isLight()"
>
  <div class="sync-diagram-main">
    <app-sync-diagram-canvas>
      <app-sync-diagram-actions-panel
        [mode]="state.syncMode()"
        [scopeLabel]="scopeLabel()"
        [hasSelection]="breadcrumbParts().length > 0"
        [running]="hasRunningOperation()"
        [canRecolher]="canRecolher()"
        (modeChange)="setMode($event)"
        (sincronizarSelecao)="sincronizarSelecao()"
        (recolher)="recolherNivel()"
        (cancelar)="cancelarOperacao()"
      />
    </app-sync-diagram-canvas>
  </div>
</div>
