<div
  class="sql-editor-shell"
  [class.max-editor]="workspaceMode === 'editor'"
  [class.max-results]="workspaceMode === 'results'"
>
  <app-sql-editor-header
    (novo)="novaConsulta()"
    (salvar)="salvarConsulta()"
    (historico)="toggleHistory()"
  />

  <app-sql-editor-toolbar
    [ambiente]="ambiente"
    [conexaoId]="conexaoId"
    [base]="base"
    [maxRows]="maxRows"
    [timeoutSeconds]="timeoutSeconds"
    [connected]="connected"
    [ambientes]="ambientes"
    [conexoes]="conexoes"
    [bases]="bases"
    [loadingConexoes]="loadingConexoes"
    [loadingBases]="loadingBases"
    (ambienteChange)="onAmbienteChange($event)"
    (conexaoIdChange)="onConexaoChange($event)"
    (baseChange)="onBaseChange($event)"
    (maxRowsChange)="maxRows = $event"
    (timeoutSecondsChange)="timeoutSeconds = $event"
    (refresh)="recarregarContexto()"
  />

  <app-sql-cloud-block-alert
    *ngIf="cloudBlockedMessage"
    [message]="cloudBlockedMessage"
    [ambiente]="ambiente"
    [isAdmin]="isAdmin"
    (usarLocal)="usarAmbienteLocal()"
  />

  <app-sql-workspace
    [sql]="sql"
    [state]="state"
    [danger]="dangerCheck"
    [catalogo]="catalogoSql"
    [result]="result"
    [errorMessage]="errorMessage"
    [resultInsights]="resultInsights"
    [queryWarnings]="queryWarnings"
    [columnStatistics]="columnStatistics"
    [history]="history"
    [workspaceGridTemplate]="workspaceGridTemplate"
    (sqlChange)="onSqlChange($event)"
    (formatar)="formatarSql()"
    (executar)="executar()"
    (executarSelecionado)="executar($event)"
    (limpar)="limparEditor()"
    (salvar)="salvarConsulta()"
    (historico)="toggleHistory()"
    (novaConsulta)="novaConsulta()"
    (maximizarEditor)="maximizarEditor()"
    (maximizarResultados)="maximizarResultados()"
    (restaurarLayout)="restaurarLayout()"
    (resizeStart)="iniciarResizeWorkspace($event)"
    (propriedadesTabela)="abrirPropriedadesTabela($event)"
    (selecionarHistorico)="aplicarHistorico($event)"
  />

  <app-sql-statusbar
    [ambiente]="ambiente"
    [conexaoLabel]="conexaoLabel"
    [base]="base"
    [rows]="result?.rows?.length || 0"
    [statusLabel]="statusLabel"
  />
</div>

  <p-dialog
        header="Propriedades da tabela"
        [(visible)]="propriedadesTabelaVisible"
        [modal]="true"
        [draggable]="false"
        [resizable]="false"
        [style]="{ width: 'min(760px, 94vw)' }"
        styleClass="sql-table-properties-dialog"
      >
        <section class="table-properties" *ngIf="tabelaSelecionada">
          <div class="table-properties-title">
            <span>{{ tabelaSelecionada.schema }}</span>
            <strong>{{ tabelaSelecionada.name }}</strong>
          </div>

          <div class="table-properties-summary">
            <span>
              <i class="pi pi-database"></i>
              Schema {{ tabelaSelecionada.schema }}
            </span>
            <span>
              <i class="pi pi-table"></i>
              {{ tabelaSelecionada.columns.length }} colunas
            </span>
          </div>

          <div class="table-columns">
            <div class="table-column table-column-header">
              <span>Coluna</span>
              <span>Tipo</span>
            </div>

            <div class="table-column" *ngFor="let coluna of tabelaSelecionada.columns">
              <span>{{ coluna.name }}</span>
              <code>{{ coluna.type || 'tipo nao informado' }}</code>
            </div>
          </div>
        </section>
      </p-dialog>
