<footer
  class="sql-statusbar"
  [class.env-cloud]="ambiente === 'cloud'"
  [class.env-local]="ambiente === 'local'"
>
  <span class="env-dot"></span>
  <strong class="env-label">{{ ambiente === 'cloud' ? 'Cloud' : 'Local' }}</strong>

  <i class="pi pi-angle-right"></i>
  <span>{{ conexaoLabel }}</span>

  <i class="pi pi-angle-right"></i>
  <span>{{ base }}</span>

  <i class="pi pi-angle-right"></i>
  <span>{{ rows }} linhas</span>

  <span class="spacer"></span>
  <span>{{ statusLabel }}</span>
</footer>
