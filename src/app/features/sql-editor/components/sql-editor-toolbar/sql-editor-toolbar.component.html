<section class="context-toolbar">
  <label>
    <span>Ambiente</span>
    <p-select
      [ngModel]="ambiente"
      (ngModelChange)="ambienteChange.emit($event)"
      [options]="ambientes"
      optionLabel="label"
      optionValue="value"
      styleClass="sql-selector"
    />
  </label>

  <label>
    <span>Conexão</span>
    <p-select
      [ngModel]="conexaoId"
      (ngModelChange)="conexaoIdChange.emit($event)"
      [options]="conexoes"
      optionLabel="label"
      optionValue="value"
      styleClass="sql-selector wide"
      [loading]="loadingConexoes"
      [filter]="true"
      filterPlaceholder="Buscar conexão..."
    />
  </label>

  <label>
    <span>Base de Dados</span>
    <p-select
      [ngModel]="base"
      (ngModelChange)="baseChange.emit($event)"
      [options]="bases"
      optionLabel="label"
      optionValue="value"
      styleClass="sql-selector"
      placeholder="db_name"
      [loading]="loadingBases"
      [filter]="true"
      filterPlaceholder="Buscar base..."
    />
  </label>

  <label>
    <span>Máximo de linhas</span>
    <p-inputnumber
      [ngModel]="maxRows"
      (ngModelChange)="maxRowsChange.emit($event)"
      [min]="1"
      [max]="10000"
      [showButtons]="true"
      inputStyleClass="number-input"
    />
  </label>

  <label>
    <span>Tempo esgotado</span>
    <p-inputnumber
      [ngModel]="timeoutSeconds"
      (ngModelChange)="timeoutSecondsChange.emit($event)"
      suffix="s"
      [min]="1"
      [max]="300"
      [showButtons]="true"
      inputStyleClass="number-input"
    />
  </label>

  <div class="status-box">
    <span>Status</span>
    <p-tag [severity]="connected ? 'success' : 'danger'" [value]="connected ? 'Conectado' : 'Desconectado'" />
  </div>

  <p-button icon="pi pi-refresh" severity="secondary" [text]="true" (click)="refresh.emit()" />
</section>
