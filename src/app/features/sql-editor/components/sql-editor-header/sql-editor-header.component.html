<header class="sql-page-header">
  <div class="title-block">
    <h1>SQL Editor</h1>
    <p>Escreva, execute e visualize resultados de consultas SQL</p>
  </div>

  <div class="header-actions">
    <p-button label="Novo" icon="pi pi-plus" severity="secondary" [outlined]="true" (click)="novo.emit()" />
    <p-button label="Salvar" icon="pi pi-save" severity="secondary" [outlined]="true" (click)="salvar.emit()" />
    <p-button label="Historico" icon="pi pi-history" severity="secondary" [outlined]="true" (click)="historico.emit()" />
    <p-button icon="pi pi-ellipsis-v" severity="secondary" [text]="true" (click)="options.toggle($event)" />
    <p-menu #options [model]="menuItems" [popup]="true" />
  </div>
</header>
