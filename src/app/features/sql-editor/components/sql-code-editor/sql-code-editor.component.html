<section class="editor-panel" [class.expanded]="expanded">
  <div class="editor-titlebar">
    <div>
      <strong>Editor SQL</strong>
      <span>&nbsp; Ctrl + Enter para executar</span>
    </div>
    <div class="title-actions">
      <span class="engine-pill">Editor ativo</span>
      <p-button
        [icon]="expanded ? 'pi pi-window-minimize' : 'pi pi-window-maximize'"
        severity="secondary"
        [outlined]="true"
        [rounded]="true"
        [text]="true"
        [title]="expanded ? 'Reduzir editor' : 'Expandir editor'"
        (click)="toggleExpanded()"
      />
    </div>
  </div>

  <div class="danger-message" *ngIf="danger.dangerous">
    <p-message severity="warn" [text]="danger.reason" />
  </div>

  <footer class="editor-footer">
    <span class="ready-state"><i class="pi pi-circle-fill"></i> Pronto para executar</span>

    <app-sql-toolbar
      [executing]="executing"
      (executar)="executar.emit()"
      (executarSelecionado)="emitSelectedSql()"
      (formatar)="formatar.emit()"
      (limpar)="limpar.emit()"
      (salvar)="salvar.emit()"
      (historico)="historico.emit()"
    />
  </footer>

  <div class="editor-body">
    <div #monacoContainer class="monaco-container" aria-label="Editor SQL"></div>
  </div>
</section>
