<section class="result-panel">
  <div class="loading-state" *ngIf="state === 'executing'">
    <p-progress-spinner />
    <span>Executando consulta...</span>
  </div>

  <div class="empty-state" *ngIf="state !== 'executing' && (!result || !result.rows.length)">
    <i class="pi pi-table"></i>
    <strong>Execute uma consulta para visualizar os resultados</strong>
    <span>Limite de linhas definido pelo usuario</span>

  </div>

  <ng-container *ngIf="state !== 'executing' && result && result.rows.length">
    <div class="result-summary">
      <span>{{ result.rows.length }} linhas retornadas</span>
      <span>{{ result.executionTimeMs }} ms</span>
      <span *ngIf="result.affectedRows !== undefined">
        {{ result.affectedRows }} linhas afetadas
      </span>
      <span *ngIf="result.riskLevel">Risco {{ result.riskLevel }}</span>
    </div>

    <div class="grid-wrapper ag-theme-quartz-dark">
      <ag-grid-angular class="result-grid" [columnDefs]="columnDefs" [rowData]="rowData" [defaultColDef]="defaultColDef"
        [gridOptions]="gridOptions" />
    </div>
  </ng-container>
</section>
