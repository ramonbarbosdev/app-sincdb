<p-dialog
  header="Atualização do sistema"
  [(visible)]="showUpdateDialog"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [style]="{ width: '420px' }">

  <!-- ============================= -->
  <!-- ATUALIZAÇÃO DISPONÍVEL -->
  <!-- ============================= -->
  <ng-container *ngIf="updateAvailable$ | async">

    <div class="flex align-items-start gap-3 mb-3">
      <i class="pi pi-info-circle text-blue-500 text-2xl"></i>

      <div>
        <p class="font-medium mb-1">
          Nova versão disponível
        </p>
        <small class="text-color-secondary">
          Recomendamos atualizar para obter melhorias e correções.
        </small>
      </div>
    </div>

    <div class="flex justify-end">
      <p-button
        label="Atualizar agora"
        icon="pi pi-refresh"
        (onClick)="update()">
      </p-button>
    </div>

  </ng-container>
  <!-- ============================= -->
  <!-- BAIXANDO -->
  <!-- ============================= -->
  <ng-container *ngIf="downloading$ | async">

    <div class="flex align-items-center gap-2 mb-4">
      <i class="pi pi-download text-primary"></i>
      <small class="text-color-secondary">
        Baixando atualização...
      </small>
    </div>

    <p-progressBar
      [value]="progress$ | async"
      [showValue]="true">
    </p-progressBar>

  </ng-container>
  <!-- ============================= -->
  <!-- PRONTO PARA INSTALAR -->
  <!-- ============================= -->
  <ng-container  *ngIf="downloaded$ | async" >

    <div class="flex align-items-start gap-3 mb-3 mt-3">
      <i class="pi pi-check-circle text-green-500 text-2xl"></i>

      <div>
        <p class="font-medium mb-1">
          Atualização pronta
        </p>
        <small class="text-color-secondary">
          O aplicativo será reiniciado para concluir a instalação.
        </small>
      </div>
    </div>

    <div class="flex justify-end">
      <p-button
        label="Instalar e reiniciar"
        icon="pi pi-check"
        severity="success"
        (onClick)="install()">
      </p-button>
    </div>

  </ng-container>

</p-dialog>
