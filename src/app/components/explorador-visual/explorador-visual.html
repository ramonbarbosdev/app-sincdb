<div class="explorer-shell">
  <app-connection-selector-header
    [base]="base"
    [esquema]="esquema"
    [bases]="bases"
    [esquemas]="esquemas"
    [loading]="loading"
    [loadingBases]="loadingBases"
    [loadingEsquemas]="loadingEsquemas"
    (baseChange)="onBaseChange($event)"
    (esquemaChange)="onEsquemaChange($event)"
    (comparar)="comparar()"
  />

  <div class="empty-state" *ngIf="!response && !loading">
    <i class="pi pi-sitemap"></i>
    <strong>Informe base e esquema para carregar a comparacao.</strong>
  </div>

  <div class="loading-state" *ngIf="loading">
    <p-progress-spinner />
  </div>

  <ng-container *ngIf="response && !loading">
    <section class="connection-strip">
      <div>
        <span>Origem</span>
        <strong>{{ response.origem.nome }}</strong>
        <p-tag [value]="response.origem.status" severity="success" />
      </div>
      <div>
        <span>Destino</span>
        <strong>{{ response.destino.nome }}</strong>
        <p-tag [value]="response.destino.status" severity="success" />
      </div>
      <div>
        <span>Base</span>
        <strong>{{ response.base }} / {{ response.esquema }}</strong>
      </div>
    </section>

    <section class="workspace">
      <app-sidebar-tree
        [schemas]="response.origem.schemas"
        [comparacoes]="response.comparacao.tabelas"
        (tabelaSelecionada)="selecionarTabela($event)"
      />

      <app-schema-diagram
        [nodes]="nodes"
        [edges]="edges"
        (tabelaSelecionada)="selecionarTabelaDiagrama($event)"
      />

      <app-table-details-panel
        [table]="selectedTable"
        [comparison]="selectedComparison"
      />
    </section>

    <section class="bottom-grid">
      <app-diff-summary [resumo]="response.comparacao.resumo" />
      <app-sql-preview-panel [sql]="response.comparacao.sqlPreview" />
    </section>
  </ng-container>
</div>
