<div class="card w-full overflow-x-auto">
  <div class="font-semibold text-xl mb-4">Mapa de Estruturas das Bases</div>

  <div class="card">

    <p-treetable [value]="nodes" [loading]="loading" [lazy]="true" (onNodeExpand)="onNodeExpand($event)"
      [scrollable]="true" scrollHeight="350px" [tableStyle]="{ 'min-width': '40rem' }">

      <ng-template #header>
        <tr>
          <th width="100px">Base</th>
          <th width="100px">Status</th>
          <th width="50px"></th>

        </tr>
      </ng-template>

      <ng-template #loadingbody>
        <tr>
          <td><p-skeleton width="150px"></p-skeleton></td>
          <td><p-skeleton width="80px"></p-skeleton></td>
        </tr>
        <tr>
          <td><p-skeleton width="120px"></p-skeleton></td>
          <td><p-skeleton width="60px"></p-skeleton></td>
        </tr>
        <tr>
          <td><p-skeleton width="180px"></p-skeleton></td>
          <td><p-skeleton width="70px"></p-skeleton></td>
        </tr>
      </ng-template>

      <ng-template #body let-rowNode let-rowData="rowData">
        <tr [ttRow]="rowNode">


          <td width="100px">
            <div class="flex items-center gap-2">
              <p-treetable-toggler [rowNode]="rowNode"></p-treetable-toggler>
              <span>{{ rowData?.nome }}</span>
            </div>
          </td>

          <td width="100px">
            <p-tag *ngIf="rowData" [severity]="rowData.cor" [value]="rowData.status"></p-tag>
          </td>
          <td width="50px">
            <p-button *ngIf="rowNode.level > 0 && rowNode.node.data.status === 'OK'" type="button" [label]="''"
              [icon]="'pi pi-ellipsis-h'" (onClick)="toggle($event, rowNode)" [text]="true" severity="secondary"   pTooltip="Opções" />

          </td>
        </tr>



      </ng-template>

    </p-treetable>

  </div>


</div>


<p-popover #op>
  <div class="flex flex-col gap-2">

    <p-button icon="pi pi-sitemap" label="Sincronizar estrutura" [text]="true" (click)="abrirSincEstrutura(selectedRow)"
      severity="secondary">
    </p-button>

    <p-button icon="pi pi-database" label="Sincronizar dados" [text]="true" (click)="abrirSincDados(selectedRow)"
      severity="secondary">
    </p-button>

  </div>
</p-popover>
