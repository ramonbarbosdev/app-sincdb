<!-- AVATAR -->
<div class="flex flex-col items-center justify-center my-6">
  <div class="relative inline-block cursor-pointer" (click)="abrirDialogLink()">
    <p-avatar
      [image]="imagem"
      [icon]="imagem ? '' : 'pi pi-user'"
      shape="circle"
      class="avatar-edit"
      styleClass="border-2 border-primary"
      [size]="'xlarge'"
      [style.width]="'8rem'"
      [style.height]="'8rem'"
    ></p-avatar>

    <div
      class="absolute bottom-2 right-2 bg-blue-400 text-white flex items-center justify-center rounded-full p-1 shadow-md edit-icon"
      aria-hidden="true"
    >
      <i class="pi pi-pencil text-sm"></i>
    </div>

    <button
      type="button"
      title="Remover foto"
      *ngIf="imagem"
      (click)="removerFoto($event)"
      class="absolute top-2 right-2 bg-red-600 text-white flex items-center justify-center rounded-full p-1 shadow-md hover:bg-red-700 transition-colors"
    >
      <i class="pi pi-trash text-sm"></i>
    </button>
  </div>
</div>

<p-dialog
  header="Link da foto de perfil"
  [(visible)]="dialogVisible"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: 'min(24rem, 92vw)' }"
  (onHide)="linkInput = linkInput.trim()"
>
  <p class="text-sm text-muted-color mb-3">
    Cole o endereço (URL) de uma imagem hospedada na internet.
  </p>
  <input
    pInputText
    type="url"
    class="w-full"
    placeholder="https://..."
    [(ngModel)]="linkInput"
    (keyup.enter)="confirmarLink()"
  />
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="dialogVisible = false" />
    <p-button label="Usar link" (onClick)="confirmarLink()" />
  </ng-template>
</p-dialog>
