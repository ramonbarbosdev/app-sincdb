<p-card  class="mt-3 p-5">
  <ng-template pTemplate="header">
    <div class="flex justify-between items-center">
      <span class=" font-semibold">
        Erros encontrados durante a sincronização
      </span>
      <p-button
        icon="pi pi-download"
        label="Exportar"
        severity="danger"
        size="small"
        (click)="exportarErros()"
      />
    </div>
  </ng-template>

  <p-table [value]="erros" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Erro</th>
        <th>Ação</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-erro>
      <tr>
        <td>{{ erro }}</td>
        <td>
          <p-button
            icon="pi pi-eye"
            size="small"
            label="Detalhes"
            severity="secondary"
            (click)="toggleDetalhes(erro)"
          ></p-button>
        </td>
      </tr>

      <tr *ngIf="erro.showDetalhes">
        <td colspan="3" class="bg-red-100 p-3 text-sm text-gray-900">
          <strong>SQL:</strong>
          <pre style="white-space: pre-wrap;">{{ erro.sql }}</pre>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
