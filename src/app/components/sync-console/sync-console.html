<div class="terminal-container" *ngIf="visible" [class.is-live]="live">
  <div class="terminal-header">
    <div class="buttons">
      <span class="btn close" (click)="closeTerminal()"></span>
      <span title="limpar" class="btn minimize" (click)="clear()"></span>
      <span class="btn maximize" (click)="openTerminal()"></span>
    </div>

    <div class="title">
      Terminal
      <span class="live-dot" *ngIf="live" aria-hidden="true"></span>
    </div>
  </div>

  <div #terminalBox id="terminal-box" class="terminal-body">
    <div
      *ngFor="let line of logs; let i = index"
      class="terminal-line"
      [class.is-latest]="i === latestIndex"
    >
      {{ line }}
    </div>
    <div class="terminal-cursor" *ngIf="live" aria-hidden="true"></div>
  </div>
</div>
