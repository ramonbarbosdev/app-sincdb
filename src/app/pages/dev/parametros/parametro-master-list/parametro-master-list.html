<div class="card">
  <div class="font-semibold text-xl mb-4">Parâmetros do Sistema</div>
  <p-table
    #dt1
    [value]="listagem"
    dataKey="id"
    [rows]="10"
    [loading]="loading"
    [rowHover]="true"
    [showGridlines]="false"
    [paginator]="true"
    [globalFilterFields]="['codigo','nomeChave']"
    responsiveLayout="scroll"
  >
    <ng-template #caption>
      <div class="flex flex-wrap gap-2 justify-between items-center">
        <div class="flex flex-wrap gap-2">
          <button
            title="Novo"
            pButton
            label="Novo"
            icon="pi pi-plus"
            class="p-button-outlined"
            (click)="onAdd()"
          ></button>

          <button
            title="Limpar"
            pButton
            label="Limpar Filtros"
            icon="pi pi-filter-slash"
            class="p-button-outlined"
            (click)="clear(dt1)"
          ></button>
        </div>

        <p-iconfield iconPosition="left" class="w-full sm:w-auto mt-2 sm:mt-0">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            #filter
            pInputText
            type="text"
            (input)="onGlobalFilter(dt1, $event)"
            placeholder="Pesquisar..."
            class="w-full sm:w-auto"
          />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th style="min-width: 10rem"></th>
        <th style="min-width: 10rem">
          Código
          <p-columnFilter
            type="text"
            field="cd_parametromaster"
            display="menu"
            placeholder="Filtrar codigo"
          ></p-columnFilter>
        </th>
        <th style="min-width: 10rem">
          Nome do parametro
          <p-columnFilter
            type="text"
            field="nm_chave"
            display="menu"
            placeholder="Filtrar nome"
          ></p-columnFilter>
        </th>
        <th style="min-width: 10rem">
          Valor
          <p-columnFilter
            type="text"
            field="valor"
            display="menu"
            placeholder="Filtrar valor"
          ></p-columnFilter>
        </th>
        <th style="min-width: 10rem">
          Ações
        </th>
       
      </tr>
    </ng-template>

    <ng-template #body let-listagem>
      <tr>
        <td>
          <p-button
            icon="pi pi-pencil"
            class="mr-2"
            [rounded]="true"
            [outlined]="true"
            (click)="onEdit(listagem)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [rounded]="true"
            [outlined]="true"
            (click)="onDelete(listagem)"
          />
        </td>
        <td>{{ listagem.codigo }}</td>
        <td>{{ listagem.nomeChave }}</td>
         <td>
          <ng-container [ngSwitch]="listagem.tipo">
            <input title="input" *ngSwitchCase="'string'" pInputText [(ngModel)]="listagem.valor" class="w-full" />
            <p-inputNumber *ngSwitchCase="'number'" [(ngModel)]="listagem.valor" class="w-full" />
            <p-toggleswitch  *ngSwitchCase="'bool'" [(ngModel)]="listagem.valor" />
            <!-- <p-calendar *ngSwitchCase="'date'" [(ngModel)]="param.valor" dateFormat="dd/mm/yy" /> -->
            <input title="input" *ngSwitchDefault pInputText [(ngModel)]="listagem.valor" class="w-full" />
          </ng-container>
        </td>
         <td>
          <p-button
            icon="pi pi-save"
            label=""
            (click)="onSave(listagem)"
            size="small"
          ></p-button>
        </td>


      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5">Nenhuma registro encontrado.</td>
      </tr>
    </ng-template>

    <ng-template #loadingbody>
      <tr>
        <td colspan="5">Carregando dados...</td>
      </tr>
    </ng-template>
  </p-table>

  <app-parametro-master-form
   [(isDialog)]="isDialog"
    [onReloadList]="onShow"
    [key]="idEdicao" 
  >

  </app-parametro-master-form>
</div>
