<div class="bg-surface-0 dark:bg-surface-950 px-6 py-20 md:px-12 lg:px-20">
  <div class="text-surface-700 dark:text-surface-100 text-center flex flex-col items-center gap-4">
    <div class="text-primary font-bold text-lg leading-tight">
      <i class="pi pi-database text-lg! leading-none!"></i>&nbsp;SINCRONIZAÇÃO INTELIGENTE
    </div>
    <div class="text-surface-900 dark:text-surface-0 font-bold text-4xl leading-tight">
      Conecte e Unifique Seus Bancos de Dados
    </div>
    <div class="text-surface-700 dark:text-surface-100 text-xl leading-normal">
      Automação, segurança e desempenho para manter suas informações sempre consistentes, em
      qualquer ambiente.
    </div>
    <div *ngIf="!loadingConexao && !temConexaoPadrao" class="mt-6 flex flex-col items-center gap-3">
      <p class="text-surface-600 dark:text-surface-200 text-base">
        Cadastre uma conexão padrão para começar a sincronizar.
      </p>
      <p-button
        label="Cadastrar conexão"
        icon="pi pi-database"
        [rounded]="true"
        (click)="irParaConexao()"
      />
    </div>
  </div>
</div>

<app-comparativo-estrutura></app-comparativo-estrutura>
<br>
<app-info-atividades></app-info-atividades>
