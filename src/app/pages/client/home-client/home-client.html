<div class="home-status px-4 py-8 md:px-8 lg:px-12">
  <div *ngIf="loading" class="card status-card status-skeleton mx-auto">
    <p-skeleton width="8rem" height="0.9rem"></p-skeleton>
    <p-skeleton width="70%" height="2rem"></p-skeleton>
    <p-skeleton width="55%" height="1rem"></p-skeleton>
    <p-skeleton width="100%" height="4.5rem" borderRadius="0.85rem"></p-skeleton>
    <p-skeleton width="11rem" height="2.4rem" borderRadius="999px"></p-skeleton>
  </div>

  <section *ngIf="!loading" class="card status-card mx-auto" [class.has-error]="temErroUltimaSync">
    <div class="status-eyebrow">
      <i class="pi pi-database"></i>
      Status do SyncDB
    </div>

    <h1 class="status-title">{{ statusTitulo }}</h1>
    <p class="status-subtitle">{{ statusSubtitulo }}</p>

    <div *ngIf="conexaoPadrao" class="connection-panel">
      <div class="connection-panel-top">
        <div class="connection-name-wrap">
          <span class="connection-label">Conexão padrão</span>
          <strong class="connection-name">{{ conexaoPadrao.nm_conexao }}</strong>
        </div>
        <app-cloud-local-pulse [compact]="true"></app-cloud-local-pulse>
      </div>

      <div class="connection-hosts">
        <div class="host-row" [attr.title]="conexaoPadrao.db_cloud_host || ''">
          <span class="env-chip env-cloud"><i class="pi pi-cloud"></i> Cloud</span>
          <span class="host-value">{{ hostCloudCurto }}</span>
        </div>
        <div class="host-row" [attr.title]="conexaoPadrao.db_local_host || ''">
          <span class="env-chip env-local"><i class="pi pi-server"></i> Local</span>
          <span class="host-value">{{ hostLocalCurto }}</span>
        </div>
      </div>
    </div>

    <div *ngIf="ultimaAtividade" class="last-sync">
      <div class="last-sync-copy">
        <span class="last-sync-label">Última sincronização</span>
        <span class="last-sync-detail">
          {{ ultimaAtividade.operacao }} · {{ ultimaAtividade.ultimaExecucao }}
        </span>
      </div>
      <p-tag [value]="ultimaAtividade.status" [severity]="statusSeverity"></p-tag>
    </div>

    <div class="status-actions">
      <p-button
        [label]="ctaLabel"
        [icon]="ctaIcon"
        [rounded]="true"
        [severity]="temErroUltimaSync ? 'danger' : 'primary'"
        styleClass="action-press"
        (click)="executarCta()"
      />
    </div>
  </section>
</div>

<div class="home-panels px-4 md:px-8 lg:px-12 pb-8">
  <app-comparativo-estrutura></app-comparativo-estrutura>
  <div class="home-gap"></div>
  <app-info-atividades></app-info-atividades>
</div>
