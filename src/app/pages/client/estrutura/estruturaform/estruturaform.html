<p-card class="w-full max-w-5xl mx-auto my-6 px-2 sm:px-4">
  <!-- HEADER -->
  <ng-template pTemplate="header">
    <div class="flex flex-col sm:flex-row justify-between items-center w-full p-4 gap-2 sm:gap-0">
      <h5 class="text-lg sm:text-xl font-semibold text-center sm:text-left">
        Sincronizar Estrutura
      </h5>
    </div>
  </ng-template>

  <ng-template #content>
    <div class="flex-row-responsive w-full">
      <app-layout-campo [label]="'Bases: (*)'" [width]="'md:w-6/12'" [error]="errorValidacao['base']">
        <p-select
          [checkmark]="true"
          [showClear]="true"
          name="base"
          [options]="listaBase"
          optionLabel="name"
          optionValue="code"
          placeholder="Selecione"
          class="w-full"
          [(ngModel)]="objeto.base"
          [loading]="loadingBase"
          (ngModelChange)="processarBase($event)"
          [ngClass]="{ 'ng-dirty ng-invalid': errorValidacao['base'] }"
          [filter]="true"
          filterPlaceholder="Buscar base..."
          [filterBy]="'name'"
        />
      </app-layout-campo>

      <app-layout-campo
        [label]="'Esquema: (*)'"
        [width]="'md:w-6/12'"
        [error]="errorValidacao['esquema']"
      >
        <p-select
          [checkmark]="true"
          [showClear]="true"
          name="esquema"
          [options]="listaEsquema"
          optionLabel="name"
          optionValue="code"
          placeholder="Selecione"
          class="w-full"
          [(ngModel)]="objeto.esquema"
          [loading]="loadingEsquema"
          (ngModelChange)="processarEsquema($event)"
          [ngClass]="{ 'ng-dirty ng-invalid': errorValidacao['esquema'] }"
          [filter]="true"
          filterPlaceholder="Buscar esquema..."
          [filterBy]="'name'"
        />
      </app-layout-campo>
    </div>

    <div class="flex-row-responsive w-full">
      <app-layout-campo [label]="'Tabela:'" [width]="'md:w-10/12'">
        <p-select
          [checkmark]="true"
          [showClear]="true"
          name="tabela"
          [options]="listaTabela"
          optionLabel="name"
          optionValue="code"
          placeholder="Selecione"
          class="w-full"
          [(ngModel)]="objeto.tabela"
          [loading]="loadingTabela"
          [filter]="true"
          filterPlaceholder="Buscar tabela..."
          [filterBy]="'name'"
        >
        </p-select>
      </app-layout-campo>
      <app-layout-campo [label]="'&nbsp;'" [width]="'md:w-2/12'">
        <p-button
        label="Verificar"
        icon="pi pi-search"
        (click)="verificar()"
        styleClass="p-button-primary w-full sm:w-auto"
        [loading]="loadingVerificacao"
      ></p-button>
      </app-layout-campo>
    </div>

    <div class="p-2 flex flex-col sm:flex-row items-center gap-4 w-full">
      <!-- Botão -->
      <!-- <p-button
        label="Verificar"
        icon="pi pi-search"
        (click)="verificar()"
        styleClass="p-button-primary w-full sm:w-auto"
        [loading]="loadingVerificacao"
      ></p-button> -->
      <!-- Progress -->
      <div class="flex-1 w-full">
        <app-sync-console></app-sync-console>
        <app-sync-progresso-bar></app-sync-progresso-bar>
      </div>
    </div>
    
  </ng-template>

  <!-- FOOTER -->
  <ng-template #footer>
    <div class="flex flex-col sm:flex-row justify-between gap-2 mt-4 px-2 sm:px-0">
      <p-button
        label="Cancelar"
        icon="pi pi-ban"
        (click)="cancelarSincronizacao()"
        styleClass="w-full sm:w-auto"
      />
      <div class="flex gap-3">
        <p-button
          label="Sincronizar"
          icon="pi pi-sync"
          (click)="execultarSincronizacao()"
          styleClass="w-full sm:w-auto"
          [loading]="loadingSincronizacao"
        />
        <p-button
          label="Verificar/Sincronizar"
          icon="pi pi-sync"
          (click)="verificarEExecutar()"
          styleClass="w-full sm:w-auto"
          [loading]="loadingSincronizacao"
        />
      </div>
    </div>
  </ng-template>
</p-card>

<p-card class="w-full max-w-5xl mx-auto my-6 px-2 sm:px-4" *ngIf="listaErros.length > 0">
  <div class="mt-4">
    <app-sync-erros [erros]="listaErros"></app-sync-erros>
  </div>
</p-card>

<app-estrutura-preview [response]="response"></app-estrutura-preview>
