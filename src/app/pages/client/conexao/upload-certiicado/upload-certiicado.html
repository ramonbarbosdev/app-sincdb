<div class="flex flex-col gap-3 mt-3">
  <label class="font-medium">Arquivo de Certificado</label>
  <p-fileupload
    #fileUpload
    customUpload="true"
    chooseLabel="Selecionar Arquivo"
    chooseIcon="pi pi-upload"
    name="certificado"
    mode="advanced"
    accept=".pfx,.pem, .enc"
    maxFileSize="1000000"
    (uploadHandler)="onUpload($event, fileUpload)"
    chooseLabel="Selecionar"
    uploadLabel="Enviar"
    cancelLabel="Cancelar"
  />
</div>
