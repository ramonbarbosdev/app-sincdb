<p-card class="w-full max-w-6xl mx-auto my-6 px-2 sm:px-4">
  <ng-template pTemplate="header">
    <div class="flex flex-col sm:flex-row justify-between items-center w-full p-4 gap-3">
      <h5 class="text-lg sm:text-xl font-semibold text-center sm:text-left">
        Conexões PostgreSQL
      </h5>

      <p-button
        label="Nova conexão"
        icon="pi pi-plus"
        (click)="novaConexao()"
        styleClass="w-full sm:w-auto"
      />
    </div>
  </ng-template>

  <ng-template #content>
    <div
      *ngIf="!loading && listaConexoes.length === 0"
      class="empty-state flex flex-col items-center justify-center text-center gap-4"
    >
      <i class="pi pi-database text-4xl text-primary"></i>

      <div>
        <h3 class="text-xl font-semibold mb-2">
          Nenhuma conexão cadastrada
        </h3>

        <p class="text-muted-color">
          Cadastre a primeira conexão da organização ativa.
        </p>
      </div>

      <p-button
        label="Nova conexão"
        icon="pi pi-plus"
        (click)="novaConexao()"
      />
    </div>

    <p-table
      *ngIf="loading || listaConexoes.length > 0"
      [value]="listaConexoes"
      [loading]="loading"
      responsiveLayout="scroll"
      styleClass="p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Nome</th>
          <th>Host Cloud</th>
          <th>Usuário Cloud</th>
          <th>Padrão</th>
          <th class="w-52 text-right">Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-conexao>
        <tr>
          <td class="font-medium">
            {{ conexao.nm_conexao }}
          </td>

          <td>
            {{ conexao.db_cloud_host }}
          </td>

          <td>
            {{ conexao.db_cloud_user }}
          </td>

          <td>
            <p-tag
              [value]="conexao.fl_padrao ? 'Padrão' : 'Secundária'"
              [severity]="conexao.fl_padrao ? 'success' : 'secondary'"
            />
          </td>

          <td>
            <div class="flex justify-end gap-2">
              <p-button
                icon="pi pi-pencil"
                [text]="true"
                [loading]="carregandoConexao"
                (click)="editarConexao(conexao)"
              />

              <p-button
                icon="pi pi-star"
                [text]="true"
                [disabled]="conexao.fl_padrao"
                (click)="marcarPadrao(conexao)"
              />

              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                (click)="removerConexao(conexao)"
              />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </ng-template>
</p-card>

<p-dialog
  [(visible)]="dialogVisible"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: 'min(920px, 94vw)' }"
  header="Conexão PostgreSQL"
  (onHide)="fecharDialog()"
>
  <div class="flex-row-responsive w-full">
    <app-layout-campo
      [error]="errorValidacao['nm_conexao']"
      [label]="'Nome da conexão: (*)'"
      [width]="'md:w-8/12'"
    >
      <input
        pInputText
        name="nm_conexao"
        [(ngModel)]="objeto.nm_conexao"
        class="w-full"
      />
    </app-layout-campo>

    <app-layout-campo
      [label]="'Padrão:'"
      [width]="'md:w-4/12'"
    >
      <div class="flex items-center gap-3 h-10">
        <p-toggleswitch
          [(ngModel)]="objeto.fl_padrao"
          name="fl_padrao"
        />

        <label>
          Usar na sincronização
        </label>
      </div>
    </app-layout-campo>
  </div>

  <h3 class="text-lg font-semibold mt-2 mb-3 text-primary">
    Servidor Cloud
  </h3>

  <div class="flex-row-responsive w-full">
    <app-layout-campo
      [error]="errorValidacao['db_cloud_host']"
      [label]="'Host: (*)'"
      [width]="'md:w-6/12'"
    >
      <input
        pInputText
        [(ngModel)]="objeto.db_cloud_host"
        class="w-full"
      />
    </app-layout-campo>

    <app-layout-campo
      [error]="errorValidacao['db_cloud_port']"
      [label]="'Porta: (*)'"
      [width]="'md:w-6/12'"
    >
      <input
        pInputText
        [(ngModel)]="objeto.db_cloud_port"
        class="w-full"
      />
    </app-layout-campo>
  </div>

  <div class="flex-row-responsive w-full">
    <app-layout-campo
      [error]="errorValidacao['db_cloud_user']"
      [label]="'Usuário: (*)'"
      [width]="'md:w-6/12'"
    >
      <input
        pInputText
        [(ngModel)]="objeto.db_cloud_user"
        class="w-full"
      />
    </app-layout-campo>

    <app-layout-campo
      [error]="errorValidacao['db_cloud_password']"
      [label]="'Senha: (*)'"
      [width]="'md:w-6/12'"
    >
      <input
        *ngIf="senhaCloudProtegidaPorCertificado"
        pInputText
        [value]="senhaCertificadoMascarada"
        class="w-full"
        readonly
      />

      <p-password
        *ngIf="!senhaCloudProtegidaPorCertificado"
        [(ngModel)]="objeto.db_cloud_password"
        [toggleMask]="true"
        [fluid]="true"
        [feedback]="false"
      />
    </app-layout-campo>
  </div>

  <div class="flex items-center gap-3 mb-5">
    <p-toggleswitch
      [(ngModel)]="objeto.fl_admin"
    />

    <label>
      Acesso administrador
    </label>
  </div>

  <div class="certificate-panel mb-5">
    <div class="flex items-center justify-between gap-3 mb-3">
      <h3 class="text-lg font-semibold text-primary">
        Certificado
      </h3>

      <p-tag
        [value]="objeto.arquivoValidado ? 'Enviado' : 'Pendente'"
        [severity]="objeto.arquivoValidado ? 'success' : 'warn'"
      />
    </div>

    <app-upload-certiicado
      [arquivoValido]="objeto.arquivoValidado"
      (certificadoEnviado)="onCertificadoEnviado($event)"
    />
  </div>

  <h3 class="text-lg font-semibold mb-3 text-primary">
    Servidor Local
  </h3>

  <div class="flex-row-responsive w-full">
    <app-layout-campo
      [error]="errorValidacao['db_local_host']"
      [label]="'Host: (*)'"
      [width]="'md:w-6/12'"
    >
      <input
        pInputText
        [(ngModel)]="objeto.db_local_host"
        class="w-full"
      />
    </app-layout-campo>

    <app-layout-campo
      [error]="errorValidacao['db_local_port']"
      [label]="'Porta: (*)'"
      [width]="'md:w-6/12'"
    >
      <input
        pInputText
        [(ngModel)]="objeto.db_local_port"
        class="w-full"
      />
    </app-layout-campo>
  </div>

  <div class="flex-row-responsive w-full">
    <app-layout-campo
      [error]="errorValidacao['db_local_user']"
      [label]="'Usuário: (*)'"
      [width]="'md:w-6/12'"
    >
      <input
        pInputText
        [(ngModel)]="objeto.db_local_user"
        class="w-full"
      />
    </app-layout-campo>

    <app-layout-campo
      [error]="errorValidacao['db_local_password']"
      [label]="'Senha: (*)'"
      [width]="'md:w-6/12'"
    >
      <p-password
        [(ngModel)]="objeto.db_local_password"
        [toggleMask]="true"
        [fluid]="true"
        [feedback]="false"
      />
    </app-layout-campo>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex flex-col sm:flex-row justify-end gap-2">
      <p-button
        label="Cancelar"
        icon="pi pi-ban"
        [text]="true"
        (click)="fecharDialog()"
      />

      <p-button
        label="Salvar"
        icon="pi pi-check"
        (click)="salvarConexao()"
        [loading]="salvando"
      />
    </div>
  </ng-template>
</p-dialog>
