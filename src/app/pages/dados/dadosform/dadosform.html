<p-card styleClass="sync-form-card w-full max-w-5xl mx-auto my-6">
  <ng-template pTemplate="header">
    <div class="sync-form-header">
      <div>
        <p class="sync-form-eyebrow">Operação</p>
        <h5 class="sync-form-title">Sincronizar Dados</h5>
      </div>
    </div>
  </ng-template>

  <ng-template #content>
    <section class="sync-connection" [class.is-empty]="!conexaoPadrao && !loadingConexaoPadrao">
      <div class="sync-connection-main">
        <!-- <div class="sync-connection-icon">
          <i class="pi pi-database"></i>
        </div> -->

        <div class="sync-connection-body">
          <div class="sync-connection-top">
            <!-- <span class="sync-connection-name">
              {{ conexaoPadrao?.nm_conexao || 'Nenhuma conexão padrão' }}
            </span> -->
            <app-cloud-local-pulse *ngIf="conexaoPadrao"></app-cloud-local-pulse>
          </div>

          <!-- <div class="sync-connection-hosts" *ngIf="conexaoPadrao">
            <span class="env-chip env-cloud" [attr.title]="conexaoPadrao.db_cloud_host || ''">
              <i class="pi pi-cloud"></i>
              <span class="env-chip-text">{{ conexaoPadrao.db_cloud_host || '—' }}</span>
            </span>
            <span class="env-chip env-local" [attr.title]="conexaoPadrao.db_local_host || ''">
              <i class="pi pi-server"></i>
              <span class="env-chip-text">{{ conexaoPadrao.db_local_host || '—' }}</span>
            </span>
          </div> -->

          <p class="sync-connection-hint" *ngIf="!conexaoPadrao && !loadingConexaoPadrao">
            Cadastre uma conexão e marque-a como padrão antes de sincronizar.
          </p>
        </div>
      </div>

      <p-button
        *ngIf="!conexaoPadrao && !loadingConexaoPadrao"
        label="Cadastrar conexão"
        icon="pi pi-database"
        size="small"
        styleClass="action-press"
        (click)="irParaConexao()"
      />
    </section>

    <section class="sync-fields">
      <div class="flex-row-responsive w-full">
        <app-layout-campo [label]="'Bases: (*)'" [width]="'md:w-6/12'" [error]="errorValidacao['base']">
          <p-select
            [checkmark]="true"
            [showClear]="true"
            name="base"
            [options]="listaBase"
            optionLabel="name"
            optionValue="code"
            placeholder="Selecione"
            class="w-full"
            [(ngModel)]="objeto.base"
            [loading]="loadingBase"
            (ngModelChange)="processarBase($event)"
            [ngClass]="{ 'ng-dirty ng-invalid': errorValidacao['base'] }"
            [filter]="true"
            filterPlaceholder="Buscar base..."
            [filterBy]="'name'"
          />
        </app-layout-campo>

        <app-layout-campo
          [label]="'Esquema: (*)'"
          [width]="'md:w-6/12'"
          [error]="errorValidacao['esquema']"
        >
          <p-select
            [checkmark]="true"
            [showClear]="true"
            name="esquema"
            [options]="listaEsquema"
            optionLabel="name"
            optionValue="code"
            placeholder="Selecione"
            class="w-full"
            [(ngModel)]="objeto.esquema"
            [loading]="loadingEsquema"
            (ngModelChange)="processarEsquema($event)"
            [ngClass]="{ 'ng-dirty ng-invalid': errorValidacao['esquema'] }"
            [filter]="true"
            filterPlaceholder="Buscar esquema..."
            [filterBy]="'name'"
          />
        </app-layout-campo>
      </div>

      <div class="sync-table-row">
        <app-layout-campo [label]="'Tabela (opcional)'" [width]="'md:w-9/12'">
          <p-select
            [checkmark]="true"
            [showClear]="true"
            name="tabela"
            [options]="listaTabela"
            optionLabel="name"
            optionValue="code"
            placeholder="Todas as tabelas do esquema"
            class="w-full"
            [(ngModel)]="objeto.tabela"
            [loading]="loadingTabela"
            [filter]="true"
            filterPlaceholder="Buscar tabela..."
            [filterBy]="'name'"
          >
          </p-select>
        </app-layout-campo>

        <div class="sync-verify-wrap">
          <p-button
            label="Verificar"
            icon="pi pi-search"
            (click)="verificar()"
            styleClass="p-button-outlined action-press w-full"
            [loading]="loadingVerificacao"
            [disabled]="!conexaoPadrao"
          ></p-button>
        </div>
      </div>
    </section>

    <section class="sync-console-wrap">
      <app-sync-console></app-sync-console>
      <app-sync-progresso-bar></app-sync-progresso-bar>
    </section>
  </ng-template>

  <ng-template #footer>
    <div class="sync-form-footer">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        (click)="cancelarSincronizacao()"
        [text]="true"
        severity="secondary"
        styleClass="action-press"
      />

      <div class="sync-form-footer-actions">
        <p-button
          label="Sincronizar"
          icon="pi pi-sync"
          (click)="execultarSincronizacao()"
          [outlined]="true"
          styleClass="action-press action-press-sync"
          [loading]="loadingSincronizacao"
          [disabled]="!conexaoPadrao"
        />
        <p-button
          label="Verificar e sincronizar"
          icon="pi pi-sync"
          (click)="verificarEExecutar()"
          styleClass="action-press action-press-sync"
          [loading]="loadingSincronizacao"
          [disabled]="!conexaoPadrao"
        />
      </div>
    </div>
  </ng-template>
</p-card>

<p-card styleClass="sync-form-card w-full max-w-5xl mx-auto my-6" *ngIf="listaErros.length > 0">
  <app-sync-erros [erros]="listaErros"></app-sync-erros>
</p-card>
