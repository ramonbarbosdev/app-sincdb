<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revisão da sincronização — SyncDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b1c1e; --canvas-dot: #2a2b2e;
    --card: #232427; --card-header: #1f2937;
    --border: #34363a; --border-strong: #46484d;
    --text-primary: #e7e8e6; --text-secondary: #9a9c9f; --text-muted: #6b6d70;
    --accent: #5b8ef2; --accent-soft: rgba(91,142,242,0.14);
    --pk: #f2b95b; --fk: #5ba0f2; --type-num: #6fbf8e; --type-str: #d98cd9; --type-date: #7fb0e0; --type-bool: #e0a15b;
    --font: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body{ margin:0; font-family: var(--font); background: var(--bg); color: var(--text-primary); }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: #1f2022;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:24px; height:24px; border-radius:6px; background: linear-gradient(135deg, var(--accent), #3f6fd6); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; color:#fff; }
  .brand .crumbs{ font-size:13px; color: var(--text-muted); display:flex; align-items:center; gap:6px; }
  .brand .crumbs b{ color: var(--text-secondary); font-weight:500; }
  .topbar-right{ display:flex; align-items:center; gap: 10px; }
  .mode-toggle{ display:flex; background:#18191b; border:1px solid var(--border); border-radius:8px; padding:3px; }
  .mode-toggle button{ border:none; background:transparent; color:var(--text-muted); font-family:var(--font); font-size:12px; font-weight:500; padding:6px 12px; border-radius:6px; cursor:pointer; }
  .mode-toggle button.active{ background: var(--card); color: var(--text-primary); }

  .confirm-btn{
    display:flex; align-items:center; gap:6px;
    background: var(--accent); color:#fff; border:none; border-radius:8px;
    padding: 8px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font);
  }
  .confirm-btn:disabled{ background:#3a3c40; color: var(--text-muted); cursor:not-allowed; }

  .layout{ display:flex; height: calc(100vh - 53px); }

  .sidebar{
    width: 230px; flex-shrink:0; border-right: 1px solid var(--border);
    background: #1f2022; padding: 14px 12px; overflow-y:auto;
  }
  .sidebar h3{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color: var(--text-muted); margin: 4px 0 10px; font-weight:600; }
  .side-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding: 8px 9px; border-radius:7px; margin-bottom:3px; cursor:pointer;
    font-size:12.5px; color: var(--text-secondary);
  }
  .side-item:hover{ background: #26282b; }
  .side-item.on-canvas{ color: var(--text-primary); }
  .side-item .dot{ width:6px; height:6px; border-radius:50%; background: var(--border-strong); flex-shrink:0; }
  .side-item.on-canvas .dot{ background: var(--accent); }
  .side-item .add-icn{ color: var(--text-muted); }

  .canvas-area{
    position: relative; flex: 1; overflow: hidden;
    background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px);
    background-size: 22px 22px;
    background-color: var(--bg);
    cursor: grab;
  }
  .canvas-area.panning{ cursor: grabbing; }

  .canvas-inner{ position:absolute; top:0; left:0; width:3000px; height:2000px; }

  svg.connectors{ position:absolute; top:0; left:0; width:3000px; height:2000px; pointer-events:none; }
  svg.connectors path{ fill:none; stroke: var(--border-strong); stroke-width:1.5; }
  svg.connectors circle{ fill: var(--border-strong); }

  .table-card{
    position: absolute;
    width: 220px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    overflow: hidden;
    user-select: none;
  }
  .table-card.selected{ border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 8px 22px rgba(91,142,242,0.18); }

  .table-card .head{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background: var(--card-header);
    padding: 8px 10px;
    cursor: grab;
    border-bottom: 1px solid var(--border);
  }
  .table-card .head .htitle{ display:flex; align-items:center; gap:7px; min-width:0; }
  .table-card .head svg.grid{ color: var(--accent); flex-shrink:0; }
  .table-card .head span.name{ font-size:12.5px; font-weight:600; color: var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .check{
    width:16px; height:16px; border-radius:4px; border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; background: #18191b;
  }
  .check.on{ background: var(--accent); border-color: var(--accent); }
  .check svg{ display:none; color:#fff; }
  .check.on svg{ display:block; }

  .cols{ padding: 3px 0; }
  .col-row{
    display:flex; align-items:center; gap:7px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-family: var(--mono);
    border-bottom: 1px solid rgba(255,255,255,0.02);
  }
  .col-row .ctype{ width:14px; text-align:center; font-size:9px; font-weight:700; border-radius:3px; flex-shrink:0; padding:1px 0; }
  .col-row .cname{ color: var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .col-row.pk .cname{ color: var(--text-primary); font-weight:600; }
  .col-row.pk{ background: rgba(242,185,91,0.06); }
  .col-row.fk .cname{ color: var(--type-str-alt, var(--text-secondary)); }

  .ctype.num{ color: var(--type-num); }
  .ctype.str{ color: var(--type-str); }
  .ctype.date{ color: var(--type-date); }
  .ctype.bool{ color: var(--type-bool); }
  .ctype.pk{ color: var(--pk); }
  .ctype.fk{ color: var(--fk); }

  .anchor{ position:absolute; width:8px; height:8px; border-radius:50%; background: var(--border-strong); }

  .legend{
    position:absolute; bottom:14px; left:14px; z-index:5;
    background: var(--card); border:1px solid var(--border); border-radius:8px;
    padding: 8px 12px; font-size:11px; color: var(--text-muted);
    display:flex; gap:14px;
  }
  .legend .li{ display:flex; align-items:center; gap:5px; }
  .legend .sw{ width:8px; height:8px; border-radius:2px; }

  .zoom-hint{
    position:absolute; top:14px; right:14px; z-index:5;
    background: var(--card); border:1px solid var(--border); border-radius:8px;
    padding: 6px 10px; font-size:11px; color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">S</div>
    <div class="crumbs">SyncDB <span>/</span> <b>Revisão do diagrama</b></div>
  </div>
  <div class="topbar-right">
    <div class="mode-toggle">
      <button class="active">Diagrama</button>
      <button onclick="alert('Voltaria para o seletor em colunas visto antes')">Colunas</button>
    </div>
    <button class="confirm-btn" id="confirm-btn">Sincronizar 2 tabelas</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <h3>Tabelas do schema <span style="color:var(--text-primary)">public</span></h3>
    <div id="side-list"></div>
  </div>

  <div class="canvas-area" id="canvas-area">
    <div class="zoom-hint">Arraste o fundo pra navegar · arraste um card pra reorganizar</div>
    <div class="legend">
      <div class="li"><span class="sw" style="background:var(--pk)"></span>chave primária</div>
      <div class="li"><span class="sw" style="background:var(--fk)"></span>chave estrangeira</div>
      <div class="li"><span class="sw" style="background:var(--accent)"></span>marcada pra sync</div>
    </div>
    <div class="canvas-inner" id="canvas-inner">
      <svg class="connectors" id="connectors"></svg>
    </div>
  </div>
</div>

<script>
/* ---------- dados mock (domínio agrícola, com FKs entre tabelas) ---------- */
const TABLES = {
  talhoes: {
    x: 520, y: 90, selected: true,
    cols: [
      { name:"id_talhao", type:"num", pk:true },
      { name:"cd_talhao", type:"num" },
      { name:"ds_nome", type:"str" },
      { name:"id_produtor", type:"num", fk:true },
      { name:"dt_cadastro", type:"date" },
      { name:"vl_area_ha", type:"num" },
      { name:"fl_ativo", type:"bool" },
    ]
  },
  produtores: {
    x: 120, y: 300, selected: true,
    cols: [
      { name:"id_produtor", type:"num", pk:true },
      { name:"ds_nome", type:"str" },
      { name:"nr_documento", type:"str" },
      { name:"dt_cadastro", type:"date" },
    ]
  },
  colheitas: {
    x: 560, y: 470, selected: false,
    cols: [
      { name:"id_colheita", type:"num", pk:true },
      { name:"id_talhao", type:"num", fk:true },
      { name:"dt_colheita", type:"date" },
      { name:"vl_quantidade", type:"num" },
      { name:"ds_unidade", type:"str" },
    ]
  },
  insumos: {
    x: 900, y: 260, selected: false,
    cols: [
      { name:"id_insumo", type:"num", pk:true },
      { name:"id_talhao", type:"num", fk:true },
      { name:"ds_nome", type:"str" },
      { name:"vl_quantidade", type:"num" },
      { name:"dt_aplicacao", type:"date" },
    ]
  }
};

const RELATIONS = [
  { from: "talhoes", fromCol: "id_produtor", to: "produtores", toCol: "id_produtor" },
  { from: "colheitas", fromCol: "id_talhao", to: "talhoes", toCol: "id_talhao" },
  { from: "insumos", fromCol: "id_talhao", to: "talhoes", toCol: "id_talhao" },
];

const gridIcon = `<svg class="grid" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`;
const checkIcon = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>`;
const typeAbbr = { num:"123", str:"AZ", date:"⏱", bool:"✓" };

const canvasInner = document.getElementById("canvas-inner");
const svg = document.getElementById("connectors");

function buildCard(id, t){
  const card = document.createElement("div");
  card.className = "table-card" + (t.selected ? " selected" : "");
  card.style.left = t.x + "px";
  card.style.top = t.y + "px";
  card.id = "card-" + id;

  const colsHtml = t.cols.map(c => {
    const rowCls = c.pk ? "pk" : (c.fk ? "fk" : "");
    const typeCls = c.pk ? "pk" : (c.fk ? "fk" : c.type);
    const abbr = c.pk ? "123" : (c.fk ? "123" : typeAbbr[c.type]);
    return `<div class="col-row ${rowCls}" data-col="${c.name}">
      <span class="ctype ${typeCls}">${abbr}</span>
      <span class="cname">${c.name}</span>
    </div>`;
  }).join("");

  card.innerHTML = `
    <div class="head">
      <div class="htitle">${gridIcon}<span class="name">${id}</span></div>
      <div class="check ${t.selected ? 'on':''}" data-check="${id}">${checkIcon}</div>
    </div>
    <div class="cols">${colsHtml}</div>
  `;
  canvasInner.appendChild(card);

  card.querySelector(".check").addEventListener("click", (e) => {
    e.stopPropagation();
    t.selected = !t.selected;
    card.classList.toggle("selected", t.selected);
    card.querySelector(".check").classList.toggle("on", t.selected);
    updateConfirmBtn();
    renderSidebar();
  });

  makeDraggable(card, t);
}

function makeDraggable(card, t){
  const head = card.querySelector(".head");
  let dragging = false, startX, startY, origX, origY;
  head.addEventListener("mousedown", (e) => {
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    origX = t.x; origY = t.y;
    e.stopPropagation();
  });
  window.addEventListener("mousemove", (e) => {
    if(!dragging) return;
    t.x = origX + (e.clientX - startX);
    t.y = origY + (e.clientY - startY);
    card.style.left = t.x + "px";
    card.style.top = t.y + "px";
    drawConnectors();
  });
  window.addEventListener("mouseup", () => { dragging = false; });
}

function anchorPoint(tableId, colName, side){
  const card = document.getElementById("card-" + tableId);
  const row = card.querySelector(`.col-row[data-col="${colName}"]`);
  const cardRect = card.getBoundingClientRect();
  const rowRect = row.getBoundingClientRect();
  const canvasRect = canvasInner.getBoundingClientRect();
  const x = (side === "left" ? cardRect.left : cardRect.right) - canvasRect.left;
  const y = rowRect.top - canvasRect.top + rowRect.height/2;
  return { x, y };
}

function drawConnectors(){
  const parts = [];
  RELATIONS.forEach(r => {
    const fromT = TABLES[r.from], toT = TABLES[r.to];
    const fromRight = fromT.x < toT.x;
    const p1 = anchorPoint(r.from, r.fromCol, fromRight ? "right" : "left");
    const p2 = anchorPoint(r.to, r.toCol, fromRight ? "left" : "right");
    const midX = (p1.x + p2.x) / 2;
    parts.push(`<path d="M${p1.x},${p1.y} C${midX},${p1.y} ${midX},${p2.y} ${p2.x},${p2.y}"/>`);
    parts.push(`<circle cx="${p1.x}" cy="${p1.y}" r="3"/>`);
    parts.push(`<circle cx="${p2.x}" cy="${p2.y}" r="3"/>`);
  });
  svg.innerHTML = parts.join("");
}

function renderSidebar(){
  const el = document.getElementById("side-list");
  el.innerHTML = "";
  Object.keys(TABLES).forEach(id => {
    const t = TABLES[id];
    const row = document.createElement("div");
    row.className = "side-item on-canvas";
    row.innerHTML = `<span style="display:flex;align-items:center;gap:8px;min-width:0"><span class="dot"></span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${id}</span></span>`;
    row.onclick = () => {
      const card = document.getElementById("card-"+id);
      card.scrollIntoView({behavior:"smooth", inline:"center", block:"center"});
    };
    el.appendChild(row);
  });
}

function updateConfirmBtn(){
  const n = Object.values(TABLES).filter(t => t.selected).length;
  const btn = document.getElementById("confirm-btn");
  btn.textContent = n > 0 ? `Sincronizar ${n} tabela${n>1?'s':''}` : "Selecione ao menos 1 tabela";
  btn.disabled = n === 0;
}

/* pan do canvas (arrastar o fundo) */
const canvasArea = document.getElementById("canvas-area");
let panning = false, panStartX, panStartY, scrollStartX, scrollStartY;
canvasArea.addEventListener("mousedown", (e) => {
  if(e.target !== canvasArea && e.target !== canvasInner && e.target.tagName !== "svg") return;
  panning = true; canvasArea.classList.add("panning");
  panStartX = e.clientX; panStartY = e.clientY;
  scrollStartX = canvasArea.scrollLeft; scrollStartY = canvasArea.scrollTop;
});
window.addEventListener("mousemove", (e) => {
  if(!panning) return;
  canvasArea.scrollLeft = scrollStartX - (e.clientX - panStartX);
  canvasArea.scrollTop = scrollStartY - (e.clientY - panStartY);
});
window.addEventListener("mouseup", () => { panning = false; canvasArea.classList.remove("panning"); });

Object.entries(TABLES).forEach(([id, t]) => buildCard(id, t));
renderSidebar();
updateConfirmBtn();
setTimeout(drawConnectors, 30);
canvasArea.scrollLeft = 350; canvasArea.scrollTop = 20;
window.addEventListener("resize", drawConnectors);
</script>

</body>
</html>
